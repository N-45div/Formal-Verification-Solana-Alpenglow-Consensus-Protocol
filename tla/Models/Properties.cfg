SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3, n4, n5}
    MaxSlot = 8
    WindowSize = 3
    ByzantineNodes = {n5}

INVARIANTS
    AllSafetyProperties
    AllResilienceProperties

PROPERTIES
    LivenessEventualFinalization
    LivenessProgress
    LivenessBoundedFinalization

CONSTRAINT
    currentSlot <= MaxSlot

\* Symmetry reduction for better performance
SYMMETRY Permutations(Nodes \ ByzantineNodes)

\* View reduction
VIEW currentSlot
